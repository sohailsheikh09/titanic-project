<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titanic Survival Predictor</title>
<style>
  :root {
    --accent-1: #00d4ff;
    --accent-2: #7b2ff7;
    --survive: #00e676;
    --sink: #ff3d5a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #0f0f1a, #000000 70%);
    color: #eaeaea;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 0 40px rgba(123, 47, 247, 0.15);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-1));
    opacity: 0.12;
    animation: spin 12s linear infinite;
    z-index: 0;
  }

  .card > * { position: relative; z-index: 1; }

  h1 {
    font-size: 1.5em;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: #999;
    font-size: 0.85em;
    margin-bottom: 24px;
  }

  label {
    display: block;
    margin-top: 16px;
    font-size: 0.8em;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #aaa;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    color: #fff;
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
  }

  select option { background: #111; color: #fff; }

  button {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 1em;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #000;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(123, 47, 247, 0.35);
  }

  button:active { transform: translateY(0); }

  #result {
    margin-top: 22px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1.05em;
    font-weight: 700;
    text-align: center;
    min-height: 24px;
    transition: all 0.3s;
  }

  #result.survived {
    background: rgba(0, 230, 118, 0.12);
    color: var(--survive);
    border: 1px solid rgba(0, 230, 118, 0.35);
  }

  #result.sunk {
    background: rgba(255, 61, 90, 0.12);
    color: var(--sink);
    border: 1px solid rgba(255, 61, 90, 0.35);
  }

  #result.pending {
    color: #999;
    font-weight: 500;
  }

  #result.error {
    background: rgba(255, 61, 90, 0.08);
    color: #ff8080;
    border: 1px solid rgba(255, 61, 90, 0.2);
  }

  #result .emoji {
    display: block;
    font-size: 3em;
    margin-bottom: 8px;
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🚢 Titanic Survival Predictor</h1>
    <div class="subtitle">Enter passenger details to predict survival odds</div>

    <form id="predict-form">
      <label>Passenger Class
        <select id="pclass">
          <option value="1">1st</option>
          <option value="2">2nd</option>
          <option value="3" selected>3rd</option>
        </select>
      </label>

      <label>Sex
        <select id="sex">
          <option value="male" selected>Male</option>
          <option value="female">Female</option>
        </select>
      </label>

      <label>Age
        <input type="number" id="age" value="30" min="0" max="100">
      </label>

      <label>Siblings/Spouses Aboard
        <input type="number" id="sibsp" value="0" min="0">
      </label>

      <label>Parents/Children Aboard
        <input type="number" id="parch" value="0" min="0">
      </label>

      <label>Fare
        <input type="number" id="fare" value="30" min="0" step="0.01">
      </label>

      <label>Port of Embarkation
        <select id="embarked">
          <option value="S" selected>Southampton</option>
          <option value="C">Cherbourg</option>
          <option value="Q">Queenstown</option>
        </select>
      </label>

      <button type="submit">Predict Survival</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const resultEl = document.getElementById("result");

    document.getElementById("predict-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        pclass: parseInt(document.getElementById("pclass").value),
        sex: document.getElementById("sex").value,
        age: parseFloat(document.getElementById("age").value),
        sibsp: parseInt(document.getElementById("sibsp").value),
        parch: parseInt(document.getElementById("parch").value),
        fare: parseFloat(document.getElementById("fare").value),
        embarked: document.getElementById("embarked").value,
      };

      resultEl.className = "pending";
      resultEl.innerHTML = "Predicting...";

      try {
        const res = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.error) {
          resultEl.className = "error";
          resultEl.innerHTML = `<span class="emoji">⚠️</span>Error: ${data.error}`;
        } else if (data.survived === 1) {
          resultEl.className = "survived";
          resultEl.innerHTML = `<span class="emoji">😄</span>Survived — probability ${(data.probability * 100).toFixed(1)}%`;
        } else {
          resultEl.className = "sunk";
          resultEl.innerHTML = `<span class="emoji">💀</span>Did not survive — probability ${(data.probability * 100).toFixed(1)}%`;
        }
      } catch (err) {
        resultEl.className = "error";
        resultEl.innerHTML = `<span class="emoji">⚠️</span>Request failed: ${err}`;
      }
    });
  </script>
</body>
</html>
